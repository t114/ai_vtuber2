# Unity VRM 連携設定 (OSC)
unity:
  enabled: true
  ip: "192.168.1.6"
  port: 39540
  motion_address: "/avatar/motion"
  expression_address: "/avatar/expression"
  send_expression: true
  send_motion: true
  talking_motions:
    - "Talking1"
    - "Talking2"
    - "Talking3"
  emotions:
    joy: "Joy"
    happy: "Happy"
    angry: "Angry"
    angry2: "Angry"
    sad: "Sad"
    surprised: "Surprised"
    blush: "Blush"
    jitome: "Jitome"
    wink: "Wink"
    sleep: "Sleep"
    gonyogonyo: "Gonyogonyo"
    cat_mouth: "CatMouth"
    perori: "Perori"
    heart: "Heart"
    star: "Star"
    note: "Note"
    sweat: "Sweat"
    pale: "Pale"
    question: "Question"
    exclamation: "Exclamation"
    zzz: "Zzz"
    neutral: "Neutral"

# ラジオ配信モードの設定
radio:
  min_talk_turns: 5
  max_talk_turns: 30
  idle_timeout: 10.0      # コメントが途絶えてからラジオを開始するまでの待機秒数
  inter_topic_gap: 3.0    # ラジオ→ラジオ間のトピック切替インターバル（秒）

# 使用するLLMプロバイダ ("ollama" または "gemini")
llm_provider: "ollama"

# Ollama 連携設定
ollama:
  model: "qwen3:14b"
  api_url: "http://localhost:11434/v1"

# YouTubeチャット投稿設定
youtube_chat:
  enabled: true
  client_secrets_file: "client_secret.json"
  token_file: "youtube_token.json"

# Gemini 連携 ＆ メガネ着用制御設定
gemini:
  model: "gemini-3.5-flash"
  api_key: ""              # 空の場合は環境変数 GEMINI_API_KEY を参照
  glasses_vts_expression: "glasses.exp3.json" # VTube Studioのメガネ用表情ファイル名
  glasses_osc_on_expression: "glasses_on"    # Unity OSCでメガネをかけるExpression名
  glasses_osc_off_expression: "glasses_off"  # Unity OSCでメガネを外すExpression名
